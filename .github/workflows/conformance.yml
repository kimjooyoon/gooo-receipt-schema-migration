name: Receipt schema migration conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Verify Go 1.27
        run: test "$(go env GOVERSION)" = "go1.27.0"

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files"

      - name: Verify inventory exception
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files 'README.md' | wc -l | tr -d ' ')" = "1"
          test "$(git ls-files | grep -v '^README\.md$' | grep -c '^README\.md$' || true)" = "0"

      - name: Verify vet
        run: go vet ./...

      - name: Verify tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-schema-migration"
          scripts/measure.sh "$RUNNER_TEMP/receipt-schema-migration/test.metrics" go test ./...

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipt-schema-migration"
          scripts/measure.sh "$RUNNER_TEMP/receipt-schema-migration/build.metrics" go build -trimpath -o "$RUNNER_TEMP/receipt-schema-migration/gooo-receipt-schema-migration" ./cmd/gooo-receipt-schema-migration

      - name: Run source to IR to generated adapters and validator to receipts to report
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/receipt-schema-migration"
          bin="$root/gooo-receipt-schema-migration"
          first="$root/first"
          replay="$root/replay"
          source=examples/receipt-schema-migration-v3/migration.gooo
          contract=contracts/receipt-migration-denominator-v3.json
          before=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          scripts/measure.sh "$root/conformance.metrics" "$bin" run --source "$source" --contract "$contract" --out "$first"
          after=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          test "$before" = "$after"

          "$bin" run --source "$source" --contract "$contract" --out "$replay" > "$root/replay.stdout"
          cmp -s "$first/semantic-ir.json" "$replay/semantic-ir.json"
          cmp -s "$first/generated/adapters/v2.json" "$replay/generated/adapters/v2.json"
          cmp -s "$first/generated/adapters/v3.json" "$replay/generated/adapters/v3.json"
          cmp -s "$first/generated/validator.json" "$replay/generated/validator.json"
          cmp -s "$first/scenario-receipts.json" "$replay/scenario-receipts.json"
          cmp -s "$first/generated/guardian-harness-cases.json" "$replay/generated/guardian-harness-cases.json"
          cmp -s "$first/report.json" "$replay/report.json"
          cmp -s "$first/human-report.md" "$replay/human-report.md"
          cmp -s "$first/adoption-proposal.json" "$replay/adoption-proposal.json"

          jq -e '
            .schema == "gooo/receipt-schema-migration/report/v3" and
            .migration_version == "v3" and
            .fixed_denominator == 20 and
            .stage_counts == {FOUNDATION:8,COHERENCE:6,REGRESSION:6} and
            .role_counts == {DRIVER:6,OUTCOME:6,GUARDRAIL:8} and
            .migration.added == 4 and .migration.retired == 0 and .migration.split == 0 and
            .migration.from_version == "v2" and .migration.to_version == "v3" and
            .migration.added_cell_ids == ["PROTECTED_PATH_AUTHORIZATION_DISPATCH","FOUNDATION_RECEIPT_EVALUATION","CHANGED_PATH_TUPLE_BINDING","UNAUTHORIZED_PROTECTED_PATH_FAIL_CLOSED"] and
            .migration.stage_delta == {FOUNDATION:2,COHERENCE:1,REGRESSION:1} and
            .migration.role_delta == {DRIVER:1,OUTCOME:1,GUARDRAIL:2} and
            .schema_versions == ["v2","v3"] and
            .precedence == ["REFUTED","UNKNOWN","CLOSED"] and
            .unknown_fields == ["stage","step","reason","unknown_class","next_operation","blocked_by"] and
            .summary == {parent_receipt_count:12,child_receipt_count:13,accepted_count:2,unknown_count:3,refuted_count:7,immutable_parent_writes:0} and
            (.scenarios | length) == 12 and
            ([.scenarios[].state] | sort) == (["ACCEPTED","ACCEPTED","UNKNOWN","UNKNOWN","UNKNOWN","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED"] | sort) and
            .authority.repository_writes == 0 and
            .authority.local_test_executions == 0 and
            .authority.cross_project_required_gates == 0 and
            .authority.root_readme_policy == "EXCLUDED_FROM_REPOSITORY_INVENTORY" and
            .improvement.state == "UNKNOWN" and
            .improvement.stage != "" and .improvement.step != "" and .improvement.reason != "" and
            .improvement.unknown_class != "" and .improvement.next_operation != "" and .improvement.blocked_by != null and
            .development_provenance.event_mutation_policy == "APPEND_ONLY_NO_RESET_DELETE_REWRITE" and
            .development_provenance.development_policy_deviation_count == 1 and
            .development_provenance.product_runtime_authority.repository_writes == 0 and
            .development_provenance.product_runtime_authority.local_test_executions == 0 and
            .development_provenance.failed_packaging_attempts == 1 and
            .development_provenance.failed_packaging_reason == "ARCHIVE_RECURSIVE_SELF_INCLUSION_AND_WRONG_TEMP_PATH" and
            .development_provenance.release_asset_used == false and
            .development_provenance.final_archive_source == "POST_MAIN_ACTIONS_ARTIFACT_ONLY" and
            .development_provenance.final_size_bytes == 35456 and
            .development_provenance.final_sha256 == "sha256:ca7c03961c74f10d16d6369e6900b7bc681bfd1cbb04523156d3f372bf2eb39a" and
            .development_provenance.reset_delete_rewrite == false
          ' "$first/report.json"

          jq -e '
            .schema == "gooo/receipt-schema-migration/adoption-proposal/v3" and
            .migration_version == "v3" and
            .target_repository == "github.com/kimjooyoon/meta-ontology-go" and
            .repository_writes == 0 and .local_test_executions == 0 and .cross_project_required_gates == 0 and
            (.old_schema_ownership | length) == 1 and (.new_schema_ownership | length) == 1 and
            (.acceptance_cases | length) == 12 and
            .expected_protected_paths == [".github/ci-governance.json",".github/agent-scope-table.md",".github/branch-policy.md",".github/conformance-plan.md",".github/foundation-authorization.json","go.mod","go.sum"] and
            (.exact_required_semantic_changes | length) >= 12 and (.rollback_conditions | length) >= 8 and
            (.refutation_conditions | length) >= 6 and (.harness_acceptance_cases | length) == 11 and
            .guardian_fixture_v3.base_commit == "e440cbc99f24ceb8385f1b89c70f8cdada10cdbb" and
            .guardian_fixture_v3.head_commit == "8b47db349315c02933296423b0ae7fa80ffeb1dc" and
            .guardian_fixture_v3.changed_files_count == 92 and .guardian_fixture_v3.protected_intersection_count == 26 and
            (.release_lineage | length) == 5 and
            (.variable_lifetime_ownership | length) == 4 and
            .development_provenance.development_local_vm_harness_executions == 1 and
            .development_provenance.policy_state == "RECORDED_DEVELOPMENT_POLICY_DEVIATION" and
            .development_provenance.failed_packaging_attempts == 1 and
            .development_provenance.final_size_bytes == 35456
          ' "$first/adoption-proposal.json"

          jq -e '
            .schema == "gooo/receipt-schema-migration/guardian-harness/v2" and
            .migration_version == "v3" and .ir_digest != "" and
            .fixture_v3.base_commit == "e440cbc99f24ceb8385f1b89c70f8cdada10cdbb" and
            (.cases | length) == 11
          ' "$first/generated/guardian-harness-cases.json"

      - name: Run actual Guardian harness from pinned fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/receipt-schema-migration"
          node scripts/run-guardian-harness-v3.js \
            --cases "$root/first/generated/guardian-harness-cases.json" \
            --report "$root/first/report.json" \
            --out "$root/first/guardian-harness-report.json"

      - name: Attach actual Guardian harness to report and proposal
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/receipt-schema-migration"
          "$root/gooo-receipt-schema-migration" attach-harness \
            --report "$root/first/report.json" \
            --harness "$root/first/guardian-harness-report.json" \
            --proposal "$root/first/adoption-proposal.json" \
            --manifest "$root/first/artifact-manifest.json" \
            --human "$root/first/human-report.md"
          jq -e '
            .schema == "gooo/receipt-schema-migration/guardian-harness/v2" and
            .fixture_file_count == 10 and
            .summary == {closed_count:2,unknown_count:0,refuted_count:9,foundation_authorization_count:8,foundation_receipt_count:8} and
            ([.results[].state] | sort) == (["CLOSED","CLOSED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED","REFUTED"] | sort) and
            ([.results[] | select(.id == "GUARDIAN_PROTECTED26_VALID_FOUNDATION_AUTH_CLOSED") | .guardian_decision] | .[0]) == "PASS" and
            ([.results[] | select(.id == "GUARDIAN_MISSING_FOUNDATION_AUTH_REFUTED") | .state] | .[0]) == "REFUTED" and
            ([.results[] | select(.id == "GUARDIAN_PASS_NULL_DIGEST_REFUTED") | .claim | keys] | .[0] | sort) == ["blocked_by","next_operation","reason","stage","state","step","unknown_class"]
          ' "$root/first/guardian-harness-report.json"
          jq -e '
            .guardian_harness.summary == {closed_count:2,unknown_count:0,refuted_count:9,foundation_authorization_count:8,foundation_receipt_count:8} and
            ([.artifact_digests[].path] | index("guardian-harness-report.json")) != null and
            .guardian_harness.results != null
          ' "$root/first/report.json"
          jq -e '([.artifacts[].path] | index("development-provenance.json")) != null' "$root/first/artifact-manifest.json"
          jq -e '(.guardian_harness_artifact.path == "guardian-harness-report.json" and (.guardian_harness_artifact.digest | startswith("sha256:")))' "$root/first/adoption-proposal.json"

      - name: Create CI summary with bound metrics
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/receipt-schema-migration"
          "$root/gooo-receipt-schema-migration" ci-summary \
            --report "$root/first/report.json" \
            --build-metrics "$root/build.metrics" \
            --test-metrics "$root/test.metrics" \
            --conformance-metrics "$root/conformance.metrics" \
            --out "$root/first/ci-summary.json"
          jq -e '
            .schema == "gooo/receipt-schema-migration/ci-summary/v1" and
            .migration_version == "v3" and
            .schema_versions == ["v2","v3"] and
            .parent_receipt_count == 12 and .child_receipt_count == 13 and
            .accepted_count == 2 and .unknown_count == 3 and .refuted_count == 7 and
            .immutable_parent_writes == 0 and
            .guardian_harness == {closed_count:2,unknown_count:0,refuted_count:9,foundation_authorization_count:8,foundation_receipt_count:8} and
            .migration.added == 4 and .migration.retired == 0 and .migration.split == 0 and
            (.adapter_operations | length) == 20 and
            ([.metrics[].id] | sort) == (["schema_versions","parent_receipt_count","child_receipt_count","accepted_count","unknown_count","refuted_count","immutable_parent_writes","adapter_operations","artifact_digests","build_wall_ms","build_peak_rss_kib","test_wall_ms","test_peak_rss_kib","conformance_wall_ms","conformance_peak_rss_kib","denominator_add_count","denominator_retire_count","denominator_split_count","guardian_harness_case_count","guardian_harness_closed_count","guardian_harness_unknown_count","guardian_harness_refuted_count","guardian_fixture_file_count","guardian_changed_file_count","guardian_protected_intersection_count","guardian_changed_paths_digest","guardian_protected_intersection_digest","guardian_kernel_before_digest","guardian_kernel_after_digest","guardian_foundation_authorization_count","guardian_foundation_receipt_count","guardian_canonical_tuple_count"] | sort) and
            ([.metrics[].id | select(test("score|percentage";"i"))] | length) == 0 and
            ([.metrics[] | select(.id == "denominator_add_count") | .value] | .[0]) == 4 and
            ([.metrics[] | select(.id == "denominator_retire_count") | .value] | .[0]) == 0 and
            ([.metrics[] | select(.id == "denominator_split_count") | .value] | .[0]) == 0 and
            ([.metrics[] | select(.id | endswith("_wall_ms")) | .value] | all(. >= 0)) and
            ([.metrics[] | select(.id | endswith("_peak_rss_kib")) | .value] | all(. >= 0)) and
            .development_provenance.schema == "gooo/receipt-schema-migration/development-provenance/v1" and
            .development_provenance.development_local_go_commands == {build:0,gofmt:0,test:0,vet:0} and
            .development_provenance.development_local_vm_harness_executions == 1 and
            .development_provenance.class == "NODE_VM_GUARDIAN_HARNESS" and
            .development_provenance.purpose == "DEBUG_AUTH_MERGE_VS_BASE_COMMIT_MOCK" and
            .development_provenance.policy_state == "RECORDED_DEVELOPMENT_POLICY_DEVIATION" and
            .development_provenance.development_policy_deviation_count == 1 and
            .development_provenance.product_runtime_authority.repository_writes == 0 and
            .development_provenance.product_runtime_authority.local_test_executions == 0 and
            .development_provenance.remaining_validation_policy == "GITHUB_ACTIONS_ONLY_AFTER_THIS_RECORD" and
            .development_provenance.failed_packaging_reason == "ARCHIVE_RECURSIVE_SELF_INCLUSION_AND_WRONG_TEMP_PATH" and
            .development_provenance.final_sha256 == "sha256:ca7c03961c74f10d16d6369e6900b7bc681bfd1cbb04523156d3f372bf2eb39a" and
            .development_provenance.release_asset_used == false and
            .development_provenance.reset_delete_rewrite == false
          ' "$root/first/ci-summary.json"

      - name: Verify final repository write boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: receipt-schema-migration-conformance
          path: ${{ runner.temp }}/receipt-schema-migration/first
          if-no-files-found: error
